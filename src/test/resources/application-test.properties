# Test profile: in-memory H2, no external services. The JWT secret below is a throw-away test value.
spring.datasource.url=jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-secret-test-only-secret-0123456789
jwt.expiration=3600000

app.rag.enabled=false
spring.ai.openai.api-key=not-configured
