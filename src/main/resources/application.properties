spring.application.name=job-tracker-backend

# ===============================
# PostgreSQL Database (credentials come from the environment - see .env.example)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:1574/job_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# 'update' is convenient for development. Use 'validate' (with a real migration
# tool) for production deployments.
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ===============================
# JWT (no default on purpose: the app refuses to start without a strong secret)
# jwt.secret must be at least 32 bytes long.
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS (comma separated list of exact origins, no wildcard)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# Multipart / resume upload limits
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.resume.max-size=5MB
app.resume.max-pages=20
app.resume.min-text-chars=50
app.resume.max-text-chars=50000

# ===============================
# Spring AI - OpenAI (chat + embeddings)
# 'not-configured' lets the app boot without a key; AI endpoints then answer 503.
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8000ms
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s

# ===============================
# RAG (pgvector). The vector store is created lazily on first use, so the app
# still boots when the pgvector extension is not installed yet.
# embedding-dimensions must match the embedding model (text-embedding-3-small = 1536).
# ===============================
app.rag.enabled=${RAG_ENABLED:true}
app.rag.initialize-schema=${RAG_INITIALIZE_SCHEMA:true}
app.rag.embedding-dimensions=1536
app.rag.chunk-size=1000
app.rag.chunk-overlap=150
app.rag.top-k=5
app.rag.similarity-threshold=0.25
app.rag.max-question-chars=500

# ===============================
# Swagger / OpenAPI (set SPRINGDOC_ENABLED=false in production)
# ===============================
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
